<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - SecureAuth Pro</title>
    <link rel="stylesheet" href="/_assets/new/css/dash.css">
    <link rel="stylesheet" href="/_assets/new/css/forms1.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/_assets/new/imports/toastr1.js"></script>
    <script src="/_assets/new/js/nav1.js"></script>
    <style>

.form-input,
.form-select {
    width: 90%; /* Adjust width as needed */
}
    </style>
</head>
<body>
    <div class="dashboard">
        {{ template "nav.html" . }}
        <main class="main-content">
            <h1>Control Panel</h1>
            <div class="panel-grid">
                <!-- Attack Configuration Form -->
                <div class="panel-card">
                    <h2>Attack Configuration</h2>
                    <form class="panel-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Target IP</label>
                                <input type="text" class="form-input" placeholder="Enter IP address">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Port</label>
                                <input type="number" class="form-input" placeholder="Enter port">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Time (seconds)</label>
                                <input type="number" class="form-input" placeholder="Attack duration">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Method</label>
                                <select class="form-select">
                                    <option value="">Select method</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Threads</label>
                            <div class="slider-container">
                                <input type="range" class="slider threads" min="1" max="100" value="50">
                                <div class="slider-value">50 threads</div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">PPS (Packets per Second)</label>
                            <div class="slider-container">
                                <input type="range" class="slider" min="100" max="10000" value="1000" step="100">
                                <div class="slider-value">1000 PPS</div>
                            </div>
                        </div>

                        <button type="submit" class="submit-button">Launch Attack</button>
                    </form>
                </div>
                
                <!-- Target List -->
                <div class="panel-card">
                    <h2>Active Targets</h2>
                    <div class="target-list">
                        <div class="target-item">
                            <span class="target-number">#1</span>
                            <span class="target-info">192.168.1.1:80</span>
                            <span class="target-time">2:30</span>
                            <span class="target-action">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </span>
                        </div>
                        <!-- More target items -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/_assets/new/js/nav1.js"></script>
    <script src="/_assets/new/js/user/panel3.js"></script>
</body>
</html>
