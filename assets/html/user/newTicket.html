<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Name}} | {{.Title}}</title>
    <link rel="stylesheet" href="/_assets/new/css/dash.css">
    <link rel="stylesheet" href="/_assets/new/css/ticket.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/_assets/new/imports/toastr1.js"></script>
    <script src="/_assets/new/js/nav1.js"></script>
</head>
<body>
    <div class="dashboard">
        {{ template "nav.html" . }}
        <main class="main-content">
                      <div class="stats-grid">
                <div class="stats-card">
                    <div class="stats-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </div>
                    <div class="stats-info">
                        <h3>Open Tickets</h3>
                        <p class="stats-value"></p>
                        <p class="stats-label">Total</p>
                    </div>
                </div>
                <div class="stats-card">
                    <div class="stats-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                    </div>
                    <div class="stats-info">
                        <h3>Avg Time</h3>
                        <p class="stats-value"></p>
                        <p class="stats-label">Hours</p>
                    </div>
                </div>
                <div class="stats-card">
                    <div class="stats-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20v-6M6 20V10M18 20V4"/>
                        </svg>
                    </div>
                    <div class="stats-info">
                        <h3>Active Admins</h3>
                        <p class="stats-value">1.2M</p>
                        <p class="stats-label">Online</p>
                    </div>
                </div>
                <div class="stats-card">
                    <div class="stats-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div class="stats-info">
                        <h3>Total Users</h3>
                        <p class="stats-value">50.2K</p>
                        <p class="stats-label">Active</p>
                    </div>
                </div>
            </div>
            <div class="tickets-header">
            </div>
            
            <div class="tickets-grid">
                <!-- New Ticket Form -->
                <div class="ticket-card">
                    <h2>Create New Ticket</h2>
                    <form class="ticket-form">
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" placeholder="Enter ticket title" id="title" required>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea placeholder="Describe your issue..." id="message" required></textarea>
                        </div>
                        <button type="submit" class="submit-button" onclick="newTicket()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            Submit Ticket
                        </button>
                    </form>
                </div>

                <!-- Ticket List -->
                <div class="ticket-card">
                    <div class="ticket-list-header">
                        <h2>Your Tickets</h2>
                        <div class="ticket-filters">
                            <select class="status-filter">
                                <option value="all">All Status</option>
                                <option value="open">Open</option>
                                <option value="pending">Pending</option>
                                <option value="closed">Closed</option>
                            </select>
                            <input type="text" placeholder="Search tickets..." class="search-input">
                        </div>
                    </div>
                    <div class="ticket-list">

                    </div>
                        <div class="pagination">
                            <button class="page-button" disabled>&laquo; Prev</button>
                            <button class="page-button active">1</button>
                            <button class="page-button">2</button>
                            <button class="page-button">3</button>
                            <button class="page-button">Next &raquo;</button>
                        </div>
                </div>
            </div>
        </main>
    </div>
    <script>
(function () {
    $.post('/api/tickets/history', function (data) {
        let response;

        try {
            response = typeof data === 'string' ? JSON.parse(data) : data;
        } catch (e) {
            console.error("Failed to parse JSON:", e);
        }

        console.log("Response from /api/tickets/history:", response);

        if (response.status === "success" && Array.isArray(response.tickets)) {
            const ticketList = document.querySelector(".ticket-list");
            if (!ticketList) {
                console.error("Element with class 'ticket-list' not found.");
                return;
            }

            ticketList.innerHTML = ""; // clear existing

            response.tickets.forEach((ticket) => {
                const ticketItem = document.createElement("div");
                ticketItem.className = "ticket-item";
                ticketItem.onclick = () => {
                    document.cookie = `ticket_id=${encodeURIComponent(ticket.id)}; path=/`;
                    document.cookie = `ticket_name=${encodeURIComponent(ticket.title)}; path=/`;
                    document.cookie = `ticket_status=${encodeURIComponent(ticket.status)}; path=/`;
                    window.location.href = `/chat?id=${ticket.id}`;
                };
                console.log(ticket)
                let statusClass = {
                    open: "open",
                    pending: "pending",
                    waiting: "pending",
                    closed: "closed"
                }[ticket.status] || "unknown";

                let priorityClass = {
                    closed: "high",
                    waiting: "medium",
                    pending: "urgent",
                    open: "low",
                }[ticket.status] || "unknown";

                ticketItem.innerHTML = `
                    <div class="ticket-status ${statusClass}"></div>
                    <div class="ticket-info">
                        <h3>${ticket.title || 'Untitled'}</h3>
                        <span class="ticket-date">${ticket.date || 'undefined'}</span>
                    </div>
                    <div class="ticket-priority ${priorityClass}">${ticket.status}</div>
                `;

                ticketList.appendChild(ticketItem);
            });

        } else if (response.status === "error") {
            console.error(response.message);
        } else {
            console.error('Failed to load tickets');
        }
    }).fail(function (xhr, status, error) {
        console.error("Request failed:", status, error);
    });
})();
function newTicket() {
    var title = document.getElementById('title').value;
    var message = document.getElementById('message').value;
    console.log(title, message)
    var ticketData = {
        title: title,
        message: message
    };

    $.post('/api/tickets/newTicket', JSON.stringify(ticketData), function(response) {
        var data = $.parseJSON(response);
        if (data.status === "success") {
            toastr['success']('Ticket submitted successfully', 'Success', { "toastClass": "toast-dark" });
            window.location.reload();
            document.cookie = `ticket_id=${ticket.id}; path=/`;
        } else if (data.status === "error") {
            toastr['error'](data.message, 'Error', { "toastClass": "toast-dark" });
        } else {
            toastr['error']('Failed to submit ticket', 'Error', { "toastClass": "toast-dark" });
        }
    }).fail(handleErrors); 
}
        </script>
</body>
</html>
